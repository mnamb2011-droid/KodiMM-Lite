name: Build KodiMM Ultimate v5.0 Arabic Android GUI (.apk)

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate KodiMM Ultimate v5.0 Arabic Android project
        run: |
          mkdir -p app/src/main/java/com/kodimm/lite app/src/main/res/drawable

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "KodiMMUltimate"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=false
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.kodimm.lite'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.kodimm.lite'
                  minSdk 24
                  targetSdk 34
                  versionCode 5
                  versionName '5.0'
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#070B14" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#E50914" android:pathData="M16,16 L92,16 L92,92 L16,92 Z" android:fillAlpha="0.20" />
              <path android:fillColor="#E50914" android:pathData="M36,26 L82,54 L36,82 Z" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="KodiMM Ultimate"
                  android:requestLegacyExternalStorage="true"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="stateHidden|adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/kodimm/lite/LocalStreamServer.java
          package com.kodimm.lite;

          import java.io.BufferedReader;
          import java.io.File;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.io.RandomAccessFile;
          import java.net.Inet4Address;
          import java.net.InetAddress;
          import java.net.NetworkInterface;
          import java.net.ServerSocket;
          import java.net.Socket;
          import java.net.URLDecoder;
          import java.net.URLEncoder;
          import java.nio.charset.StandardCharsets;
          import java.util.Enumeration;
          import java.util.List;
          import java.util.Locale;

          public class LocalStreamServer {

              private ServerSocket serverSocket;
              private volatile boolean running = false;
              private File moviesRoot;
              private File tvRoot;
              private int port = 8080;

              public boolean isRunning() {
                  return running;
              }

              public int getPort() {
                  return port;
              }

              public static String getLocalIp() {
                  try {
                      Enumeration<NetworkInterface> ifaces = NetworkInterface.getNetworkInterfaces();
                      while (ifaces.hasMoreElements()) {
                          NetworkInterface ni = ifaces.nextElement();
                          if (!ni.isUp() || ni.isLoopback()) continue;
                          Enumeration<InetAddress> addrs = ni.getInetAddresses();
                          while (addrs.hasMoreElements()) {
                              InetAddress a = addrs.nextElement();
                              if (a instanceof Inet4Address && !a.isLoopbackAddress()) {
                                  return a.getHostAddress();
                              }
                          }
                      }
                  } catch (Exception ignored) {}
                  return "127.0.0.1";
              }

              public void start(File moviesDir, File tvDir, int listenPort) throws Exception {
                  stop();
                  this.moviesRoot = moviesDir;
                  this.tvRoot = tvDir;
                  this.port = listenPort;
                  this.serverSocket = new ServerSocket(port);
                  this.running = true;

                  new Thread(() -> {
                      while (running) {
                          try {
                              Socket client = serverSocket.accept();
                              new Thread(() -> handleClient(client)).start();
                          } catch (Exception e) {
                              if (!running) break;
                          }
                      }
                  }).start();
              }

              public void stop() {
                  running = false;
                  try {
                      if (serverSocket != null) serverSocket.close();
                  } catch (Exception ignored) {}
                  serverSocket = null;
              }

              private void handleClient(Socket socket) {
                  try (Socket s = socket;
                       BufferedReader in = new BufferedReader(new InputStreamReader(s.getInputStream(), StandardCharsets.UTF_8));
                       OutputStream out = s.getOutputStream()) {

                      String reqLine = in.readLine();
                      if (reqLine == null || reqLine.isEmpty()) return;
                      String[] parts = reqLine.split(" ");
                      if (parts.length < 2) return;
                      String rawPath = parts[1];
                      int qIdx = rawPath.indexOf('?');
                      if (qIdx >= 0) rawPath = rawPath.substring(0, qIdx);
                      String path = URLDecoder.decode(rawPath, "UTF-8");

                      String rangeHeader = null;
                      String line;
                      while ((line = in.readLine()) != null && !line.isEmpty()) {
                          if (line.toLowerCase(Locale.US).startsWith("range:")) {
                              rangeHeader = line.substring(6).trim();
                          }
                      }

                      if (path.equals("/") || path.equals("/index.html")) {
                          sendHtml(out, buildHomeHtml());
                          return;
                      }

                      File target = null;
                      if (path.startsWith("/movies/") && moviesRoot != null) {
                          target = safeResolve(moviesRoot, path.substring("/movies/".length()));
                      } else if (path.startsWith("/tv/") && tvRoot != null) {
                          target = safeResolve(tvRoot, path.substring("/tv/".length()));
                      } else if (path.equals("/movies") && moviesRoot != null) {
                          target = moviesRoot;
                      } else if (path.equals("/tv") && tvRoot != null) {
                          target = tvRoot;
                      }

                      if (target == null || !target.exists()) {
                          sendStatus(out, "404 Not Found", "Not Found");
                          return;
                      }

                      if (target.isDirectory()) {
                          String prefix = path.endsWith("/") ? path : (path + "/");
                          sendHtml(out, buildDirectoryListing(target, prefix));
                      } else {
                          sendFile(out, target, rangeHeader);
                      }
                  } catch (Exception ignored) {}
              }

              private File safeResolve(File root, String rel) throws Exception {
                  File f = new File(root, rel).getCanonicalFile();
                  String rootCanon = root.getCanonicalPath();
                  if (!f.getPath().startsWith(rootCanon)) return null;
                  return f;
              }

              private String buildHomeHtml() {
                  StringBuilder sb = new StringBuilder();
                  sb.append("<!DOCTYPE html><html lang=\"ar\" dir=\"rtl\"><head><meta charset=\"UTF-8\">")
                    .append("<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">")
                    .append("<title>KodiMM Ultimate Stream</title>")
                    .append("<style>body{background:#070B14;color:#F8FAFC;font-family:sans-serif;margin:0;padding:18px}")
                    .append("h1{color:#E50914;margin:0 0 8px}a{color:#38BDF8;text-decoration:none}")
                    .append(".bar{display:flex;gap:10px;margin:10px 0 18px}.btn{background:#1E293B;padding:8px 14px;border-radius:8px;color:#fff}")
                    .append(".grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}")
                    .append(".card{background:#131B2E;border:1px solid #1E293B;border-radius:12px;overflow:hidden;display:block}")
                    .append(".card img{width:100%;height:230px;object-fit:cover;display:block;background:#090D16}")
                    .append(".info{padding:8px}.t{font-weight:bold;font-size:13px;color:#fff}.m{font-size:11px;color:#94A3B8;margin-top:4px}")
                    .append("</style></head><body><h1>🎬 KodiMM Ultimate — البث المباشر</h1>")
                    .append("<div class=\"bar\"><a class=\"btn\" href=\"/movies/\">📂 دليل الأفلام لـ Kodi</a>")
                    .append("<a class=\"btn\" href=\"/tv/\">📺 دليل المسلسلات لـ Kodi</a></div><div class=\"grid\">");

                  if (moviesRoot != null && moviesRoot.exists()) {
                      List<MediaHelper.MediaItem> movies = MediaHelper.scanLibrary(moviesRoot, true);
                      for (MediaHelper.MediaItem m : movies) {
                          if (m.mainVideo == null) continue;
                          try {
                              String fEnc = URLEncoder.encode(m.folder.getName(), "UTF-8").replace("+", "%20");
                              String vEnc = URLEncoder.encode(m.mainVideo.getName(), "UTF-8").replace("+", "%20");
                              sb.append("<a class=\"card\" href=\"/movies/").append(fEnc).append("/").append(vEnc).append("\">");
                              if (m.hasPoster) sb.append("<img src=\"/movies/").append(fEnc).append("/poster.jpg\" loading=\"lazy\">");
                              sb.append("<div class=\"info\"><div class=\"t\">").append(MediaHelper.esc(m.displayTitle)).append("</div>")
                                .append("<div class=\"m\">").append(MediaHelper.esc(m.year))
                                .append(m.rating.isEmpty() ? "" : " • ★ " + MediaHelper.esc(m.rating))
                                .append("</div></div></a>");
                          } catch (Exception ignored) {}
                      }
                  }
                  sb.append("</div></body></html>");
                  return sb.toString();
              }

              private String buildDirectoryListing(File dir, String urlPrefix) {
                  StringBuilder sb = new StringBuilder();
                  sb.append("<!DOCTYPE html><html><head><meta charset=\"UTF-8\"><title>Index of ").append(MediaHelper.esc(urlPrefix)).append("</title></head><body>");
                  sb.append("<h1>Index of ").append(MediaHelper.esc(urlPrefix)).append("</h1><pre>");
                  File[] list = dir.listFiles();
                  if (list != null) {
                      for (File f : list) {
                          try {
                              String enc = URLEncoder.encode(f.getName(), "UTF-8").replace("+", "%20");
                              String slash = f.isDirectory() ? "/" : "";
                              sb.append("<a href=\"").append(urlPrefix).append(enc).append(slash).append("\">")
                                .append(MediaHelper.esc(f.getName())).append(slash).append("</a>\n");
                          } catch (Exception ignored) {}
                      }
                  }
                  sb.append("</pre></body></html>");
                  return sb.toString();
              }

              private String guessMime(String name) {
                  String n = name.toLowerCase(Locale.US);
                  if (n.endsWith(".mp4") || n.endsWith(".m4v")) return "video/mp4";
                  if (n.endsWith(".mkv")) return "video/x-matroska";
                  if (n.endsWith(".avi")) return "video/x-msvideo";
                  if (n.endsWith(".webm")) return "video/webm";
                  if (n.endsWith(".jpg") || n.endsWith(".jpeg")) return "image/jpeg";
                  if (n.endsWith(".png")) return "image/png";
                  if (n.endsWith(".nfo") || n.endsWith(".xml")) return "application/xml; charset=utf-8";
                  if (n.endsWith(".srt")) return "text/plain; charset=utf-8";
                  return "application/octet-stream";
              }

              private void sendFile(OutputStream out, File file, String rangeHeader) throws Exception {
                  long len = file.length();
                  long start = 0, end = len - 1;
                  boolean partial = false;
                  if (rangeHeader != null && rangeHeader.startsWith("bytes=")) {
                      String[] r = rangeHeader.substring(6).split("-");
                      if (!r[0].isEmpty()) start = Long.parseLong(r[0]);
                      if (r.length > 1 && !r[1].isEmpty()) end = Long.parseLong(r[1]);
                      if (end >= len) end = len - 1;
                      partial = true;
                  }
                  long contentLen = (end - start) + 1;
                  StringBuilder hdr = new StringBuilder();
                  hdr.append(partial ? "HTTP/1.1 206 Partial Content\r\n" : "HTTP/1.1 200 OK\r\n");
                  hdr.append("Content-Type: ").append(guessMime(file.getName())).append("\r\n");
                  hdr.append("Accept-Ranges: bytes\r\n");
                  hdr.append("Content-Length: ").append(contentLen).append("\r\n");
                  if (partial) hdr.append("Content-Range: bytes ").append(start).append("-").append(end).append("/").append(len).append("\r\n");
                  hdr.append("Connection: close\r\n\r\n");
                  out.write(hdr.toString().getBytes(StandardCharsets.UTF_8));

                  try (RandomAccessFile raf = new RandomAccessFile(file, "r")) {
                      raf.seek(start);
                      byte[] buf = new byte[65536];
                      long remaining = contentLen;
                      while (remaining > 0) {
                          int n = raf.read(buf, 0, (int) Math.min(buf.length, remaining));
                          if (n <= 0) break;
                          out.write(buf, 0, n);
                          remaining -= n;
                      }
                  }
                  out.flush();
              }

              private void sendHtml(OutputStream out, String html) throws Exception {
                  byte[] bytes = html.getBytes(StandardCharsets.UTF_8);
                  String hdr = "HTTP/1.1 200 OK\r\nContent-Type: text/html; charset=utf-8\r\nContent-Length: " + bytes.length + "\r\nConnection: close\r\n\r\n";
                  out.write(hdr.getBytes(StandardCharsets.UTF_8));
                  out.write(bytes);
                  out.flush();
              }

              private void sendStatus(OutputStream out, String status, String body) throws Exception {
                  byte[] bytes = body.getBytes(StandardCharsets.UTF_8);
                  String hdr = "HTTP/1.1 " + status + "\r\nContent-Type: text/plain\r\nContent-Length: " + bytes.length + "\r\nConnection: close\r\n\r\n";
                  out.write(hdr.getBytes(StandardCharsets.UTF_8));
                  out.write(bytes);
                  out.flush();
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/kodimm/lite/MediaHelper.java
          package com.kodimm.lite;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.HashMap;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          import java.util.Set;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public class MediaHelper {

              public static final String DEFAULT_TMDB_KEY = "fdf6b54f7a4ded2dba55962e6a12c75e";
              public static final String TMDB_API = "https://api.themoviedb.org/3";
              public static final String TMDB_IMG = "https://image.tmdb.org/t/p";

              public static final Set<String> VIDEO_EXTS = new HashSet<>(Arrays.asList(
                  ".mp4", ".mkv", ".avi", ".mov", ".m4v", ".ts", ".wmv", ".flv", ".webm"
              ));

              private static final Pattern YEAR_PATTERN = Pattern.compile("[\\(\\[\\.\\s_-]((?:19|20)\\d{2})[\\)\\]\\.\\s_-]?");
              private static final Pattern JUNK_PATTERN = Pattern.compile(
                  "(?i)\\b(480p|720p|1080p|2160p|4k|uhd|hdr|hdr10|dv|web[-.\\s]?dl|webrip|bluray|bdrip|" +
                  "brrip|dvdrip|hdrip|hdtv|x264|x265|h264|h265|hevc|av1|aac|ac3|dts|atmos|5\\.1|7\\.1|" +
                  "10bit|8bit|remux|yify|yts|rarbg|extended|unrated|proper|repack|subbed|dubbed|arabic|multi)\\b"
              );
              public static final Pattern EPISODE_PATTERN = Pattern.compile("[Ss](\\d{1,2})[Ee](\\d{1,3})|(\\d{1,2})x(\\d{1,3})");

              public interface Logger {
                  void log(String msg);
              }

              public static class ScrapeOptions {
                  public String apiKey = DEFAULT_TMDB_KEY;
                  public String lang = "ar-EG";
                  public String posterSize = "w780";
                  public String fanartSize = "w1280";
                  public boolean dlPoster = true;
                  public boolean dlFanart = true;
                  public boolean dlLogo = true;
                  public boolean dlLandscape = true;
                  public boolean dlSeasonPosters = true;
                  public boolean dlEpisodeThumbs = false;
                  public boolean force = false;
                  public boolean autoRename = false;
              }

              public static class MediaItem {
                  public File folder;
                  public File mainVideo;
                  public boolean isMovie;
                  public boolean hasNfo;
                  public boolean hasPoster;
                  public boolean hasFanart;
                  public boolean hasLogo;
                  public boolean hasLandscape;
                  public boolean hasSrt;
                  public int episodeCount;
                  public int missingEpNfo;
                  public long sizeBytes;
                  public String displayTitle = "";
                  public String originalTitle = "";
                  public String year = "";
                  public String rating = "";
                  public String runtime = "";
                  public String genres = "";
                  public List<String> genreList = new ArrayList<>();
                  public String director = "";
                  public String collection = "";
                  public String plot = "";
                  public String actorsSummary = "";
                  public String tmdbId = "";

                  public boolean isComplete() {
                      return hasNfo && hasPoster && hasLogo && (isMovie || missingEpNfo == 0);
                  }

                  public double ratingValue() {
                      try { return Double.parseDouble(rating); } catch (Exception e) { return 0.0; }
                  }

                  public int yearValue() {
                      try { return Integer.parseInt(year); } catch (Exception e) { return 0; }
                  }

                  public int runtimeMinutes() {
                      try { return Integer.parseInt(runtime); } catch (Exception e) { return 0; }
                  }
              }

              public static boolean isVideoFile(File f) {
                  if (f == null || !f.isFile()) return false;
                  String name = f.getName().toLowerCase(Locale.US);
                  int dot = name.lastIndexOf('.');
                  return dot >= 0 && VIDEO_EXTS.contains(name.substring(dot));
              }

              public static String stripExt(String name) {
                  int dot = name.lastIndexOf('.');
                  return dot > 0 ? name.substring(0, dot) : name;
              }

              public static String sanitizeFilename(String s) {
                  if (s == null) return "";
                  return s.replaceAll("[\\\\/:*?\"<>|]", " ").replaceAll("\\s+", " ").trim();
              }

              public static String[] cleanNameAndYear(String raw) {
                  String name = raw == null ? "" : raw;
                  String year = null;
                  Matcher m = YEAR_PATTERN.matcher(name);
                  if (m.find()) {
                      year = m.group(1);
                      name = name.substring(0, m.start());
                  }
                  name = name.replace('.', ' ').replace('_', ' ').replace('-', ' ');
                  name = JUNK_PATTERN.matcher(name).replaceAll(" ");
                  name = name.replaceAll("\\s+", " ").trim();
                  name = name.replaceAll("^[\\(\\[\\s]+|[\\)\\]\\s]+$", "");
                  return new String[]{name, year};
              }

              public static String formatSize(long bytes) {
                  if (bytes >= 1073741824L) return String.format(Locale.US, "%.2f GB", bytes / 1073741824.0);
                  if (bytes >= 1048576L) return String.format(Locale.US, "%.0f MB", bytes / 1048576.0);
                  return (bytes / 1024L) + " KB";
              }

              public static String extractXmlTag(String xml, String tag) {
                  if (xml == null) return "";
                  Pattern p = Pattern.compile("<" + tag + "(?:\\s+[^>]*)?>(.*?)</" + tag + ">", Pattern.DOTALL);
                  Matcher m = p.matcher(xml);
                  return m.find() ? unesc(m.group(1)).trim() : "";
              }

              public static List<String> extractXmlTagList(String xml, String tag) {
                  List<String> out = new ArrayList<>();
                  if (xml == null) return out;
                  Pattern p = Pattern.compile("<" + tag + "(?:\\s+[^>]*)?>(.*?)</" + tag + ">", Pattern.DOTALL);
                  Matcher m = p.matcher(xml);
                  while (m.find()) {
                      String v = unesc(m.group(1)).trim();
                      if (!v.isEmpty()) out.add(v);
                  }
                  return out;
              }

              public static String extractSetName(String xml) {
                  if (xml == null) return "";
                  Pattern p = Pattern.compile("<set>.*?<name>(.*?)</name>.*?</set>", Pattern.DOTALL);
                  Matcher m = p.matcher(xml);
                  return m.find() ? unesc(m.group(1)).trim() : "";
              }

              public static String extractActorsSummary(String xml) {
                  if (xml == null) return "";
                  Pattern p = Pattern.compile("<actor>.*?<name>(.*?)</name>(?:.*?<role>(.*?)</role>)?.*?</actor>", Pattern.DOTALL);
                  Matcher m = p.matcher(xml);
                  StringBuilder sb = new StringBuilder();
                  int count = 0;
                  while (m.find() && count < 8) {
                      String name = unesc(m.group(1)).trim();
                      String role = m.group(2) != null ? unesc(m.group(2)).trim() : "";
                      if (!name.isEmpty()) {
                          if (sb.length() > 0) sb.append("  •  ");
                          sb.append(name);
                          if (!role.isEmpty()) sb.append(" (").append(role).append(")");
                          count++;
                      }
                  }
                  return sb.toString();
              }

              public static String extractTmdbId(String xml) {
                  if (xml == null) return "";
                  Pattern p = Pattern.compile("<uniqueid[^>]*type=\"tmdb\"[^>]*>(.*?)</uniqueid>", Pattern.DOTALL);
                  Matcher m = p.matcher(xml);
                  return m.find() ? m.group(1).trim() : "";
              }

              public static String unesc(String s) {
                  return s.replace("&amp;", "&").replace("&lt;", "<").replace("&gt;", ">")
                          .replace("&quot;", "\"").replace("&apos;", "'");
              }

              public static String esc(String s) {
                  if (s == null) return "";
                  return s.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")
                          .replace("\"", "&quot;").replace("'", "&apos;");
              }

              public static String readText(File f) {
                  if (f == null || !f.exists()) return "";
                  try (FileInputStream fis = new FileInputStream(f)) {
                      byte[] data = new byte[(int) Math.min(f.length(), 512 * 1024)];
                      int n = fis.read(data);
                      return n > 0 ? new String(data, 0, n, StandardCharsets.UTF_8) : "";
                  } catch (Exception e) { return ""; }
              }

              public static void writeText(File dest, String content) throws Exception {
                  try (FileOutputStream out = new FileOutputStream(dest)) {
                      out.write(content.getBytes(StandardCharsets.UTF_8));
                  }
              }

              public static void collectVideos(File dir, List<File> out) {
                  File[] list = dir.listFiles();
                  if (list == null) return;
                  Arrays.sort(list, (a, b) -> a.getName().compareToIgnoreCase(b.getName()));
                  for (File f : list) {
                      if (f.isDirectory()) collectVideos(f, out);
                      else if (isVideoFile(f)) out.add(f);
                  }
              }

              public static boolean deleteRecursive(File f) {
                  if (f == null || !f.exists()) return false;
                  if (f.isDirectory()) {
                      File[] children = f.listFiles();
                      if (children != null) for (File c : children) deleteRecursive(c);
                  }
                  return f.delete();
              }

              public static List<MediaItem> scanLibrary(File baseDir, boolean isMovies) {
                  List<MediaItem> items = new ArrayList<>();
                  if (baseDir == null || !baseDir.exists() || !baseDir.isDirectory()) return items;
                  File[] children = baseDir.listFiles();
                  if (children == null) return items;
                  Arrays.sort(children, (a, b) -> a.getName().compareToIgnoreCase(b.getName()));

                  for (File folder : children) {
                      if (!folder.isDirectory() || folder.getName().startsWith(".") || folder.getName().equals("KodiMM_NFO_Backup")) continue;
                      MediaItem it = new MediaItem();
                      it.folder = folder;
                      it.isMovie = isMovies;
                      File[] files = folder.listFiles();
                      File nfoFile;
                      if (isMovies) {
                          if (files != null) {
                              for (File f : files) {
                                  if (isVideoFile(f)) {
                                      it.sizeBytes += f.length();
                                      if (it.mainVideo == null || f.length() > it.mainVideo.length()) it.mainVideo = f;
                                  } else if (f.isFile() && f.getName().toLowerCase(Locale.US).endsWith(".srt")) {
                                      it.hasSrt = true;
                                  }
                              }
                          }
                          if (it.mainVideo == null) continue;
                          nfoFile = new File(folder, "movie.nfo");
                      } else {
                          List<File> vids = new ArrayList<>();
                          collectVideos(folder, vids);
                          it.episodeCount = vids.size();
                          for (File v : vids) {
                              it.sizeBytes += v.length();
                              if (it.mainVideo == null) it.mainVideo = v;
                              File epNfo = new File(v.getParentFile(), stripExt(v.getName()) + ".nfo");
                              if (!epNfo.exists() || epNfo.length() < 20) it.missingEpNfo++;
                          }
                          nfoFile = new File(folder, "tvshow.nfo");
                      }

                      it.hasNfo = nfoFile.exists() && nfoFile.length() > 30;
                      if (it.hasNfo) {
                          String xml = readText(nfoFile);
                          it.displayTitle = extractXmlTag(xml, "title");
                          it.originalTitle = extractXmlTag(xml, "originaltitle");
                          it.year = extractXmlTag(xml, "year");
                          it.rating = extractXmlTag(xml, "rating");
                          it.runtime = extractXmlTag(xml, "runtime");
                          it.genreList = extractXmlTagList(xml, "genre");
                          it.genres = String.join(" • ", it.genreList);
                          it.director = String.join(", ", extractXmlTagList(xml, "director"));
                          it.collection = extractSetName(xml);
                          it.plot = extractXmlTag(xml, "plot");
                          it.actorsSummary = extractActorsSummary(xml);
                          it.tmdbId = extractTmdbId(xml);
                      }
                      it.hasPoster = new File(folder, "poster.jpg").exists() && new File(folder, "poster.jpg").length() > 500;
                      it.hasFanart = new File(folder, "fanart.jpg").exists() && new File(folder, "fanart.jpg").length() > 500;
                      it.hasLogo = new File(folder, "clearlogo.png").exists() && new File(folder, "clearlogo.png").length() > 200;
                      it.hasLandscape = new File(folder, "landscape.jpg").exists() && new File(folder, "landscape.jpg").length() > 500;

                      if (it.displayTitle.isEmpty()) {
                          String[] ny = cleanNameAndYear(folder.getName());
                          it.displayTitle = ny[0].isEmpty() ? folder.getName() : ny[0];
                          if (it.year.isEmpty() && ny[1] != null) it.year = ny[1];
                      }
                      items.add(it);
                  }
                  return items;
              }

              public static int organizeLooseMovies(File baseDir, Logger logger) {
                  int moved = 0;
                  File[] items = baseDir.listFiles();
                  if (items == null) return 0;
                  for (File item : items) {
                      if (isVideoFile(item)) {
                          String stem = stripExt(item.getName());
                          String[] ny = cleanNameAndYear(stem);
                          String folderName = sanitizeFilename((ny[1] != null) ? (ny[0] + " (" + ny[1] + ")") : ny[0]);
                          if (folderName.isEmpty()) folderName = stem;
                          File targetDir = new File(baseDir, folderName);
                          if (!targetDir.exists()) targetDir.mkdirs();
                          if (item.renameTo(new File(targetDir, item.getName()))) {
                              moved++;
                              if (logger != null) logger.log("📁 تنظيم: " + item.getName() + " ← " + folderName + "/");
                              for (File sub : items) {
                                  if (sub.isFile() && sub.getName().startsWith(stem) && sub.getName().toLowerCase(Locale.US).endsWith(".srt")) {
                                      sub.renameTo(new File(targetDir, sub.getName()));
                                  }
                              }
                          }
                      }
                  }
                  return moved;
              }

              public static int syncSubtitleNames(List<MediaItem> movies, Logger logger) {
                  int fixed = 0;
                  for (MediaItem m : movies) {
                      if (m.mainVideo == null) continue;
                      String vidStem = stripExt(m.mainVideo.getName());
                      File[] files = m.folder.listFiles();
                      if (files == null) continue;
                      List<File> srts = new ArrayList<>();
                      boolean alreadyMatched = false;
                      for (File f : files) {
                          if (f.isFile() && f.getName().toLowerCase(Locale.US).endsWith(".srt")) {
                              srts.add(f);
                              if (f.getName().startsWith(vidStem)) alreadyMatched = true;
                          }
                      }
                      if (!alreadyMatched && srts.size() == 1) {
                          File src = srts.get(0);
                          File dst = new File(m.folder, vidStem + ".ar.srt");
                          if (!dst.exists() && src.renameTo(dst)) {
                              fixed++;
                              if (logger != null) logger.log("💬 مزامنة ترجمة: " + m.folder.getName() + " ← " + dst.getName());
                          }
                      }
                  }
                  return fixed;
              }

              public static int batchRenameMovies(List<MediaItem> movies, Logger logger) {
                  int count = 0;
                  for (MediaItem m : movies) {
                      String base = !m.originalTitle.isEmpty() ? m.originalTitle : m.displayTitle;
                      String targetName = sanitizeFilename(m.year.isEmpty() ? base : (base + " (" + m.year + ")"));
                      if (!targetName.isEmpty() && !targetName.equals(m.folder.getName())) {
                          File dest = new File(m.folder.getParentFile(), targetName);
                          if (!dest.exists() && m.folder.renameTo(dest)) {
                              count++;
                              if (logger != null) logger.log("🏷 " + m.folder.getName() + " ← " + targetName);
                          }
                      }
                  }
                  return count;
              }

              public static int backupNfoFiles(File baseDir, List<MediaItem> items, Logger logger) {
                  File backupDir = new File(baseDir, "KodiMM_NFO_Backup");
                  if (!backupDir.exists()) backupDir.mkdirs();
                  int count = 0;
                  for (MediaItem it : items) {
                      File nfo = new File(it.folder, it.isMovie ? "movie.nfo" : "tvshow.nfo");
                      if (nfo.exists()) {
                          try {
                              writeText(new File(backupDir, sanitizeFilename(it.folder.getName()) + ".nfo"), readText(nfo));
                              count++;
                          } catch (Exception ignored) {}
                      }
                  }
                  if (logger != null) logger.log("💾 تم نسخ " + count + " ملف NFO احتياطياً");
                  return count;
              }

              public static int restoreNfoFiles(File baseDir, List<MediaItem> items, Logger logger) {
                  File backupDir = new File(baseDir, "KodiMM_NFO_Backup");
                  if (!backupDir.exists()) return 0;
                  int count = 0;
                  for (MediaItem it : items) {
                      File src = new File(backupDir, sanitizeFilename(it.folder.getName()) + ".nfo");
                      if (src.exists()) {
                          try {
                              File dst = new File(it.folder, it.isMovie ? "movie.nfo" : "tvshow.nfo");
                              writeText(dst, readText(src));
                              count++;
                          } catch (Exception ignored) {}
                      }
                  }
                  if (logger != null) logger.log("♻️ تم استعادة " + count + " ملف NFO");
                  return count;
              }

              public static int cleanupBrokenFiles(File baseDir, Logger logger) {
                  int removed = 0;
                  if (baseDir == null || !baseDir.exists()) return 0;
                  File[] list = baseDir.listFiles();
                  if (list == null) return 0;
                  for (File f : list) {
                      if (f.isDirectory()) removed += cleanupBrokenFiles(f, logger);
                      else if (f.isFile()) {
                          String n = f.getName().toLowerCase(Locale.US);
                          if ((n.endsWith(".jpg") || n.endsWith(".png") || n.endsWith(".nfo")) && f.length() < 30) {
                              if (f.delete()) {
                                  removed++;
                                  if (logger != null) logger.log("🧹 حذف ملف تالف: " + f.getName());
                              }
                          }
                      }
                  }
                  return removed;
              }

