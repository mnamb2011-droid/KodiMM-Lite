                  opt.autoRename = cbAutoRename.isChecked();
                  opt.force = cbForce.isChecked();
                  return opt;
              }

              private boolean hasStoragePermission() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) return Environment.isExternalStorageManager();
                  return checkSelfPermission(Manifest.permission.WRITE_EXTERNAL_STORAGE) == PackageManager.PERMISSION_GRANTED;
              }

              private void updatePermissionButton() {
                  if (hasStoragePermission()) {
                      btnPerm.setText("✅ صلاحية الوصول الكامل للملفات مفعّلة");
                      btnPerm.setBackground(roundBg("#10B981", 10));
                  } else {
                      btnPerm.setText("🔓 اضغط لمنح صلاحية الوصول للملفات (مطلوب)");
                      btnPerm.setBackground(roundBg("#D97706", 10));
                  }
              }

              private void requestStoragePermission() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      try {
                          Intent intent = new Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION);
                          intent.setData(Uri.parse("package:" + getPackageName()));
                          startActivity(intent);
                      } catch (Exception e) {
                          startActivity(new Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION));
                      }
                  } else {
                      requestPermissions(new String[]{
                          Manifest.permission.READ_EXTERNAL_STORAGE,
                          Manifest.permission.WRITE_EXTERNAL_STORAGE
                      }, 101);
                  }
              }

              private void showFolderPicker(EditText targetInput) {
                  List<File> roots = new ArrayList<>();
                  roots.add(Environment.getExternalStorageDirectory());
                  File[] vols = new File("/storage").listFiles();
                  if (vols != null) {
                      for (File v : vols) if (v.isDirectory() && v.canRead() && !v.getName().equals("emulated") && !v.getName().equals("self")) roots.add(v);
                  }
                  if (roots.size() > 1) {
                      String[] names = new String[roots.size()];
                      for (int i = 0; i < roots.size(); i++) names[i] = (i == 0 ? "📱 الذاكرة الداخلية: " : "💾 فلاشة USB / SD: ") + roots.get(i).getAbsolutePath();
                      new AlertDialog.Builder(this).setTitle("اختر وحدة التخزين")
                          .setItems(names, (d, w) -> openFolderDialog(roots.get(w), targetInput)).show();
                  } else {
                      File start = new File(targetInput.getText().toString().trim());
                      if (!start.exists() || !start.isDirectory()) start = Environment.getExternalStorageDirectory();
                      openFolderDialog(start, targetInput);
                  }
              }

              private void openFolderDialog(File currentDir, EditText targetInput) {
                  List<File> subDirs = new ArrayList<>();
                  File[] list = currentDir.listFiles();
                  if (list != null) {
                      Arrays.sort(list, (a, b) -> a.getName().compareToIgnoreCase(b.getName()));
                      for (File f : list) if (f.isDirectory() && !f.getName().startsWith(".")) subDirs.add(f);
                  }
                  List<String> labels = new ArrayList<>();
                  boolean hasParent = currentDir.getParentFile() != null && currentDir.getParentFile().canRead();
                  if (hasParent) labels.add("⬆️ رجوع للمجلد السابق");
                  for (File d : subDirs) labels.add("📁 " + d.getName());

                  new AlertDialog.Builder(this).setTitle("📂 " + currentDir.getAbsolutePath())
                      .setItems(labels.toArray(new String[0]), (dialog, which) -> {
                          if (hasParent && which == 0) openFolderDialog(currentDir.getParentFile(), targetInput);
                          else openFolderDialog(subDirs.get(hasParent ? which - 1 : which), targetInput);
                      })
                      .setPositiveButton("✅ اختيار هذا المجلد", (d, w) -> {
                          targetInput.setText(currentDir.getAbsolutePath());
                          savePrefs();
                          refreshAllLibraries();
                      })
                      .setNegativeButton("إلغاء", null).show();
              }

              private void refreshAllLibraries() {
                  if (!hasStoragePermission()) {
                      tvMoviesStats.setText("امنح صلاحية الملفات من تبويب ⚙️ الإعدادات أولاً");
                      tvTvStats.setText("امنح صلاحية الملفات من تبويب ⚙️ الإعدادات أولاً");
                      return;
                  }
                  File mDir = new File(etMoviesPath.getText().toString().trim());
                  File tDir = new File(etTvPath.getText().toString().trim());
                  new Thread(() -> {
                      List<MediaHelper.MediaItem> mList = MediaHelper.scanLibrary(mDir, true);
                      List<MediaHelper.MediaItem> tList = MediaHelper.scanLibrary(tDir, false);
                      cachedMovies = mList;
                      cachedTv = tList;
                      runOnUiThread(() -> {
                          buildGenreChips();
                          renderSpotlight();
                          renderLibrary(true);
                          renderLibrary(false);
                          updateDashboard();
                      });
                  }).start();
              }

              private void buildGenreChips() {
                  genreChipsMovies.removeAllViews();
                  Set<String> allGenres = new TreeSet<>();
                  for (MediaHelper.MediaItem m : cachedMovies) allGenres.addAll(m.genreList);
                  if (allGenres.isEmpty()) return;

                  List<String> list = new ArrayList<>();
                  list.add("");
                  list.addAll(allGenres);
                  for (String g : list) {
