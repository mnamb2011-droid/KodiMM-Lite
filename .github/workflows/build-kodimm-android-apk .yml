              private void toggleStreamServer() {
                  if (streamServer.isRunning()) {
                      streamServer.stop();
                      btnServerToggle.setText("📡 تشغيل سيرفر البث (Port 8080)");
                      btnServerToggle.setBackground(roundBg("#10B981", 10));
                      tvServerStatus.setText("متوقف حالياً");
                      tvServerStatus.setTextColor(Color.parseColor("#94A3B8"));
                  } else {
                      if (!hasStoragePermission()) { requestStoragePermission(); return; }
                      File mDir = new File(etMoviesPath.getText().toString().trim());
                      File tDir = new File(etTvPath.getText().toString().trim());
                      try {
                          streamServer.start(mDir, tDir, 8080);
                          String ip = LocalStreamServer.getLocalIp();
                          String url = "http://" + ip + ":8080/";
                          btnServerToggle.setText("⏹ إيقاف سيرفر البث");
                          btnServerToggle.setBackground(roundBg("#DC2626", 10));
                          tvServerStatus.setText("✅ السيرفر شغّال الآن!\nافتح في متصفح شاشة LG أو أضفه كمصدر HTTP في Kodi:\n" + url + "\n(الأفلام: " + url + "movies/  |  المسلسلات: " + url + "tv/)");
                          tvServerStatus.setTextColor(Color.parseColor("#34D399"));
                      } catch (Exception e) {
                          Toast.makeText(this, "تعذر تشغيل السيرفر: " + e.getMessage(), Toast.LENGTH_LONG).show();
                      }
                  }
              }

              private void showAnalyticsDialog() {
                  int totalMins = 0, complete = 0;
                  Map<String, Integer> genreCounts = new HashMap<>();
                  List<MediaHelper.MediaItem> top = new ArrayList<>(cachedMovies);
                  Collections.sort(top, (a, b) -> Double.compare(b.ratingValue(), a.ratingValue()));

                  for (MediaHelper.MediaItem m : cachedMovies) {
                      totalMins += m.runtimeMinutes();
                      if (m.isComplete()) complete++;
                      for (String g : m.genreList) genreCounts.put(g, genreCounts.getOrDefault(g, 0) + 1);
                  }
                  int pct = cachedMovies.isEmpty() ? 0 : (complete * 100 / cachedMovies.size());
                  int hours = totalMins / 60;

                  StringBuilder sb = new StringBuilder();
                  sb.append("🎯 نسبة اكتمال مكتبة الأفلام: ").append(pct).append("% (").append(complete).append("/").append(cachedMovies.size()).append(")\n");
                  sb.append("⏱ إجمالي ساعات المشاهدة: ~").append(hours).append(" ساعة\n\n");
                  sb.append("🏆 أعلى 5 أفلام تقييماً:\n");
                  for (int i = 0; i < Math.min(5, top.size()); i++) {
                      MediaHelper.MediaItem m = top.get(i);
                      sb.append((i + 1)).append(". ").append(m.displayTitle).append(" (★ ").append(m.rating).append(")\n");
                  }
                  if (!genreCounts.isEmpty()) {
                      sb.append("\n🎭 أكثر الأنواع في مكتبتك:\n");
                      List<Map.Entry<String, Integer>> gl = new ArrayList<>(genreCounts.entrySet());
                      Collections.sort(gl, (a, b) -> Integer.compare(b.getValue(), a.getValue()));
                      for (int i = 0; i < Math.min(6, gl.size()); i++) {
                          sb.append("• ").append(gl.get(i).getKey()).append(": ").append(gl.get(i).getValue()).append(" فيلم\n");
                      }
                  }
                  new AlertDialog.Builder(this)
                      .setTitle("📈 تحليلات المكتبة السينمائية")
                      .setMessage(sb.toString())
                      .setPositiveButton("ممتاز", null)
                      .show();
              }

