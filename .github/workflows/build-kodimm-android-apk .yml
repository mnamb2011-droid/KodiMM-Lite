              private void openTmdbArtworkGallery(MediaHelper.MediaItem it, int artType) {
                  MediaHelper.ScrapeOptions opt = buildOptions();
                  Toast.makeText(this, "جاري جلب الصور المتاحة...", Toast.LENGTH_SHORT).show();
                  new Thread(() -> {
                      try {
                          JSONObject imgObj = MediaHelper.tmdbGet((it.isMovie ? "/movie/" : "/tv/") + it.tmdbId + "/images", opt.apiKey, "");
                          String key = artType == 0 ? "posters" : (artType == 1 ? "backdrops" : "logos");
                          JSONArray arr = imgObj.optJSONArray(key);
                          if (arr == null || arr.length() == 0) { runOnUiThread(() -> Toast.makeText(this, "لا توجد صور متاحة", Toast.LENGTH_LONG).show()); return; }
                          int max = Math.min(12, arr.length());
                          List<String> paths = new ArrayList<>();
                          List<Bitmap> thumbs = new ArrayList<>();
                          for (int i = 0; i < max; i++) {
                              String fp = arr.getJSONObject(i).optString("file_path", "");
                              if (fp.isEmpty()) continue;
                              paths.add(fp);
                              thumbs.add(downloadBitmap(MediaHelper.TMDB_IMG + "/w300" + fp));
                          }
                          runOnUiThread(() -> {
                              HorizontalScrollView hsv = new HorizontalScrollView(this);
                              hsv.setBackgroundColor(Color.parseColor("#070B14"));
                              LinearLayout row = new LinearLayout(this);
                              row.setOrientation(LinearLayout.HORIZONTAL);
                              row.setPadding(dp(12), dp(14), dp(12), dp(14));
                              hsv.addView(row);

                              AlertDialog galleryDlg = new AlertDialog.Builder(this)
                                  .setTitle("اضغط على الصورة المطلوبة لحفظها")
                                  .setView(hsv).setNegativeButton("إلغاء", null).create();

                              for (int i = 0; i < paths.size(); i++) {
                                  final String fp = paths.get(i);
                                  ImageView iv = new ImageView(this);
                                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(artType == 0 ? dp(110) : dp(190), artType == 0 ? dp(165) : dp(115));
                                  lp.setMargins(dp(6), 0, dp(6), 0);
                                  iv.setLayoutParams(lp);
                                  iv.setScaleType(artType == 2 ? ImageView.ScaleType.FIT_CENTER : ImageView.ScaleType.CENTER_CROP);
                                  iv.setBackground(cardBg("#1E293B", "#475569", 8));
                                  if (thumbs.get(i) != null) iv.setImageBitmap(thumbs.get(i));
                                  iv.setOnClickListener(v -> {
                                      galleryDlg.dismiss();
                                      String size = artType == 0 ? opt.posterSize : (artType == 1 ? opt.fanartSize : "original");
                                      String fname = artType == 0 ? "poster.jpg" : (artType == 1 ? "fanart.jpg" : "clearlogo.png");
                                      Toast.makeText(this, "جاري تحميل " + fname + "...", Toast.LENGTH_SHORT).show();
                                      new Thread(() -> {
                                          boolean ok = MediaHelper.downloadFile(MediaHelper.TMDB_IMG + "/" + size + fp, new File(it.folder, fname));
                                          runOnUiThread(() -> { Toast.makeText(this, ok ? "✅ تم تحديث " + fname : "فشل التحميل", Toast.LENGTH_SHORT).show(); refreshAllLibraries(); });
                                      }).start();
                                  });
                                  row.addView(iv);
                              }
                              galleryDlg.show();
                          });
                      } catch (Exception e) { runOnUiThread(() -> Toast.makeText(this, "خطأ: " + e.getMessage(), Toast.LENGTH_LONG).show()); }
                  }).start();
              }

              private Bitmap downloadBitmap(String urlStr) {
                  try {
                      HttpURLConnection c = (HttpURLConnection) new URL(urlStr).openConnection();
                      c.setConnectTimeout(10000); c.setReadTimeout(15000);
                      try (InputStream in = c.getInputStream()) { return BitmapFactory.decodeStream(in); }
                      finally { c.disconnect(); }
                  } catch (Exception e) { return null; }
              }

              private void playVideo(File video) {
                  if (video == null || !video.exists()) return;
                  try {
                      Intent i = new Intent(Intent.ACTION_VIEW);
                      i.setDataAndType(Uri.fromFile(video), "video/*");
                      i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      startActivity(Intent.createChooser(i, "تشغيل الفيديو باستخدام"));
                  } catch (Exception e) { Toast.makeText(this, "تعذر فتح المشغل", Toast.LENGTH_LONG).show(); }
              }

