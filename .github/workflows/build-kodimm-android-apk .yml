                  String[] labels = new String[keys.size()];
                  labels[0] = "🎬 عرض كل الأفلام (إلغاء فلتر السلسلة)";
                  for (int i = 1; i < keys.size(); i++) {
                      labels[i] = "📚 " + keys.get(i) + " (" + cols.get(keys.get(i)) + " أفلام)";
                  }
                  new AlertDialog.Builder(this)
