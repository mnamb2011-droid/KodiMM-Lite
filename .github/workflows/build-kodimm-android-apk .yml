                      .putBoolean("dl_logo", cbLogo.isChecked())
                      .putBoolean("dl_landscape", cbLandscape.isChecked())
                      .putBoolean("dl_seasons", cbSeasonPosters.isChecked())
                      .putBoolean("dl_ep_thumbs", cbEpThumbs.isChecked())
