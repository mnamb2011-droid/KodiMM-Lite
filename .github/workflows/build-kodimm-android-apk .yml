              private void loadPrefs() {
                  SharedPreferences sp = getSharedPreferences(PREFS, MODE_PRIVATE);
                  etApiKey.setText(sp.getString("api_key", MediaHelper.DEFAULT_TMDB_KEY));
                  etMoviesPath.setText(sp.getString("movies_path", "/storage/emulated/0/Movies"));
                  etTvPath.setText(sp.getString("tv_path", "/storage/emulated/0/Movies/TVShows"));
                  if ("en-US".equals(sp.getString("lang", "ar-EG"))) rbEn.setChecked(true); else rbAr.setChecked(true);
                  String q = sp.getString("quality", "high");
                  if ("med".equals(q)) rbQualMed.setChecked(true);
                  else if ("orig".equals(q)) rbQualOrig.setChecked(true);
                  else rbQualHigh.setChecked(true);

                  cbPoster.setChecked(sp.getBoolean("dl_poster", true));
                  cbFanart.setChecked(sp.getBoolean("dl_fanart", true));
                  cbLogo.setChecked(sp.getBoolean("dl_logo", true));
                  cbLandscape.setChecked(sp.getBoolean("dl_landscape", true));
                  cbSeasonPosters.setChecked(sp.getBoolean("dl_seasons", true));
                  cbEpThumbs.setChecked(sp.getBoolean("dl_ep_thumbs", false));
                  cbAutoRename.setChecked(sp.getBoolean("auto_rename", false));
                  cbForce.setChecked(sp.getBoolean("force", false));
              }

              private void savePrefs() {
                  String q = rbQualMed.isChecked() ? "med" : (rbQualOrig.isChecked() ? "orig" : "high");
