              private void showSimilarDialog(MediaHelper.MediaItem it) {
                  if (it.tmdbId.isEmpty()) { Toast.makeText(this, "اجلب بيانات العمل أولاً", Toast.LENGTH_SHORT).show(); return; }
                  MediaHelper.ScrapeOptions opt = buildOptions();
                  Toast.makeText(this, "جاري جلب الأعمال المشابهة...", Toast.LENGTH_SHORT).show();
                  new Thread(() -> {
                      try {
                          JSONObject obj = MediaHelper.tmdbGet((it.isMovie ? "/movie/" : "/tv/") + it.tmdbId + "/recommendations", opt.apiKey, "language=" + opt.lang);
                          JSONArray arr = obj.optJSONArray("results");
                          if (arr == null || arr.length() == 0) { runOnUiThread(() -> Toast.makeText(this, "لا توجد اقتراحات مشابهة", Toast.LENGTH_SHORT).show()); return; }
                          int max = Math.min(10, arr.length());
                          String[] items = new String[max];
                          for (int i = 0; i < max; i++) {
