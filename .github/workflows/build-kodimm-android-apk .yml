              private void startBatchScrape(boolean isMovies, boolean both) {
                  if (isRunning) return;
                  if (!hasStoragePermission()) { Toast.makeText(this, "امنح صلاحية الملفات أولاً", Toast.LENGTH_LONG).show(); switchTab(3); return; }
                  savePrefs();
                  MediaHelper.ScrapeOptions opt = buildOptions();

                  stopRequested = false;
                  setToolsUiRunning(true);
                  runOnUiThread(() -> { tvLog.setText(""); progressBar.setProgress(0); tvToolsStatus.setText("جاري البدء..."); });

                  new Thread(() -> {
                      try {
                          if (both || isMovies) runBatchForType(true, opt);
                          if (!stopRequested && (both || !isMovies)) runBatchForType(false, opt);
                          runOnUiThread(() -> {
                              if (!stopRequested) { progressBar.setProgress(100); tvToolsStatus.setText("✅ اكتمل الفحص بنجاح!"); appendLog("\n✅ تم الانتهاء بنجاح!"); }
                              else tvToolsStatus.setText("تم الإيقاف");
                              refreshAllLibraries();
                          });
                      } finally { setToolsUiRunning(false); }
                  }).start();
              }

              private void runBatchForType(boolean isMovies, MediaHelper.ScrapeOptions opt) {
                  File baseDir = new File((isMovies ? etMoviesPath : etTvPath).getText().toString().trim());
                  if (!baseDir.exists() || !baseDir.isDirectory()) { appendLog("[!] المسار غير موجود: " + baseDir.getAbsolutePath()); return; }
                  if (isMovies) MediaHelper.organizeLooseMovies(baseDir, this::appendLog);
                  List<MediaHelper.MediaItem> items = MediaHelper.scanLibrary(baseDir, isMovies);
                  appendLog((isMovies ? "🎬 الأفلام: " : "📺 المسلسلات: ") + items.size() + " مجلد");
                  int total = Math.max(1, items.size());
                  for (int i = 0; i < items.size(); i++) {
                      if (stopRequested) break;
                      MediaHelper.MediaItem it = items.get(i);
                      int pct = (int) (((i + 1) * 100.0) / total);
                      int cur = i + 1;
                      runOnUiThread(() -> { progressBar.setProgress(pct); tvToolsStatus.setText(cur + " / " + items.size() + " : " + it.folder.getName()); });
                      if (!opt.force && it.isComplete()) { appendLog("⏭ تخطي (مكتمل): " + it.folder.getName()); continue; }
                      try {
                          String[] ny = MediaHelper.cleanNameAndYear(it.folder.getName());
                          String query = ny[0].isEmpty() ? it.displayTitle : ny[0];
                          appendLog("🔍 " + query + (ny[1] != null ? " (" + ny[1] + ")" : ""));
                          JSONArray res = MediaHelper.searchTmdb(isMovies, query, ny[1], opt.apiKey, opt.lang);
                          if (res.length() == 0) { appendLog("  [!] لا توجد نتيجة — جرّب البحث اليدوي"); continue; }
                          int id = res.getJSONObject(0).getInt("id");
                          if (isMovies) MediaHelper.scrapeMovieById(it.folder, id, opt, this::appendLog);
                          else MediaHelper.scrapeTvById(it.folder, id, opt, this::appendLog);
                      } catch (Exception e) { appendLog("  [!] خطأ: " + e.getMessage()); }
                  }
              }
          }
          EOF

      - name: Build KodiMM Ultimate v5.0 APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk KodiMM-Ultimate-v5.apk
          ls -lh KodiMM-Ultimate-v5.apk

      - name: Upload KodiMM-Ultimate-v5.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: KodiMM-Ultimate-v5-APK
          path: KodiMM-Ultimate-v5.apk
          retention-days: 30
