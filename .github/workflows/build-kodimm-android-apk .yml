              private void showNfoEditorDialog(MediaHelper.MediaItem it) {
                  File nfoFile = new File(it.folder, it.isMovie ? "movie.nfo" : "tvshow.nfo");
                  String xml = MediaHelper.readText(nfoFile);

                  ScrollView sv = new ScrollView(this);
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setPadding(dp(16), dp(12), dp(16), dp(12));
                  sv.addView(box);

                  EditText etTitle = new EditText(this); etTitle.setHint("العنوان");
                  etTitle.setText(MediaHelper.extractXmlTag(xml, "title").isEmpty() ? it.displayTitle : MediaHelper.extractXmlTag(xml, "title"));
                  EditText etYear = new EditText(this); etYear.setHint("السنة");
                  etYear.setText(MediaHelper.extractXmlTag(xml, "year").isEmpty() ? it.year : MediaHelper.extractXmlTag(xml, "year"));
                  EditText etRating = new EditText(this); etRating.setHint("التقييم");
                  etRating.setText(MediaHelper.extractXmlTag(xml, "rating"));
                  EditText etPlot = new EditText(this); etPlot.setHint("القصة / الوصف"); etPlot.setMinLines(4);
                  etPlot.setText(MediaHelper.extractXmlTag(xml, "plot"));

                  box.addView(etTitle); box.addView(etYear); box.addView(etRating); box.addView(etPlot);

                  new AlertDialog.Builder(this).setTitle("✏️ تعديل " + nfoFile.getName()).setView(sv)
                      .setPositiveButton("حفظ", (d, w) -> {
                          try {
                              String rootTag = it.isMovie ? "movie" : "tvshow";
                              String updated;
                              if (xml.contains("<" + rootTag + ">")) {
                                  updated = replaceOrInsertTag(xml, "title", etTitle.getText().toString().trim(), rootTag);
                                  updated = replaceOrInsertTag(updated, "year", etYear.getText().toString().trim(), rootTag);
                                  updated = replaceOrInsertTag(updated, "rating", etRating.getText().toString().trim(), rootTag);
                                  updated = replaceOrInsertTag(updated, "plot", etPlot.getText().toString().trim(), rootTag);
                              } else {
                                  updated = "<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\n<" + rootTag + ">\n"
                                      + "  <title>" + MediaHelper.esc(etTitle.getText().toString().trim()) + "</title>\n"
                                      + "  <year>" + MediaHelper.esc(etYear.getText().toString().trim()) + "</year>\n"
                                      + "  <rating>" + MediaHelper.esc(etRating.getText().toString().trim()) + "</rating>\n"
                                      + "  <plot>" + MediaHelper.esc(etPlot.getText().toString().trim()) + "</plot>\n"
                                      + "</" + rootTag + ">\n";
                              }
                              MediaHelper.writeText(nfoFile, updated);
                              Toast.makeText(this, "✅ تم حفظ NFO", Toast.LENGTH_SHORT).show();
                              refreshAllLibraries();
                          } catch (Exception e) { Toast.makeText(this, "خطأ: " + e.getMessage(), Toast.LENGTH_LONG).show(); }
                      }).setNegativeButton("إلغاء", null).show();
              }

              private String replaceOrInsertTag(String xml, String tag, String val, String rootTag) {
                  String safe = MediaHelper.esc(val);
                  if (xml.contains("<" + tag + ">")) {
                      return xml.replaceAll("(?s)<" + tag + ">.*?</" + tag + ">", "<" + tag + ">" + java.util.regex.Matcher.quoteReplacement(safe) + "</" + tag + ">");
                  }
                  return xml.replace("</" + rootTag + ">", "  <" + tag + ">" + safe + "</" + tag + ">\n</" + rootTag + ">");
              }

