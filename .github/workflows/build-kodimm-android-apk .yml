                      JSONArray genres = d.optJSONArray("genres");
                      if (genres != null) for (int i = 0; i < genres.length(); i++) xml.append("  <genre>").append(esc(genres.getJSONObject(i).optString("name"))).append("</genre>\n");
                      JSONArray cast = credits.optJSONArray("cast");
                      if (cast != null) {
                          for (int i = 0; i < Math.min(12, cast.length()); i++) {
                              JSONObject a = cast.getJSONObject(i);
                              xml.append("  <actor><name>").append(esc(a.optString("name")))
                                 .append("</name><role>").append(esc(a.optString("character")))
                                 .append("</role><order>").append(i).append("</order>");
                              String pp = a.optString("profile_path", "");
                              if (!pp.isEmpty()) xml.append("<thumb>").append(TMDB_IMG).append("/w500").append(pp).append("</thumb>");
                              xml.append("</actor>\n");
                          }
                      }
                      xml.append("</tvshow>\n");
                      writeText(nfo, xml.toString());
                      if (logger != null) logger.log("  ✓ tvshow.nfo");
                  }

                  File poster = new File(folder, "poster.jpg");
                  String pp = d.optString("poster_path", "");
                  if (opt.dlPoster && (opt.force || !poster.exists()) && !pp.isEmpty() && downloadFile(TMDB_IMG + "/" + opt.posterSize + pp, poster)) {
                      if (logger != null) logger.log("  ✓ poster.jpg");
                  }
                  File fanart = new File(folder, "fanart.jpg");
                  String bp = d.optString("backdrop_path", "");
                  if (opt.dlFanart && (opt.force || !fanart.exists()) && !bp.isEmpty() && downloadFile(TMDB_IMG + "/" + opt.fanartSize + bp, fanart)) {
                      if (logger != null) logger.log("  ✓ fanart.jpg");
                  }
                  File logo = new File(folder, "clearlogo.png");
                  String lp = pickBestLogo(images, langShort);
                  if (opt.dlLogo && (opt.force || !logo.exists()) && lp != null && downloadFile(TMDB_IMG + "/original" + lp, logo)) {
                      if (logger != null) logger.log("  ✓ clearlogo.png");
                  }

                  if (opt.dlSeasonPosters) {
                      JSONArray seasons = d.optJSONArray("seasons");
                      if (seasons != null) {
                          for (int i = 0; i < seasons.length(); i++) {
                              JSONObject s = seasons.getJSONObject(i);
                              int sNum = s.optInt("season_number", -1);
                              String sp = s.optString("poster_path", "");
                              if (sNum > 0 && !sp.isEmpty()) {
                                  File spFile = new File(folder, String.format(Locale.US, "season%02d-poster.jpg", sNum));
                                  if (opt.force || !spFile.exists()) downloadFile(TMDB_IMG + "/" + opt.posterSize + sp, spFile);
                              }
                          }
                      }
                  }

                  Map<Integer, JSONArray> seasonCache = new HashMap<>();
                  List<File> videos = new ArrayList<>();
                  collectVideos(folder, videos);
                  for (File vid : videos) {
                      String stem = stripExt(vid.getName());
                      File epNfo = new File(vid.getParentFile(), stem + ".nfo");
                      File epThumb = new File(vid.getParentFile(), stem + "-thumb.jpg");
                      if (!opt.force && epNfo.exists() && (!opt.dlEpisodeThumbs || epThumb.exists())) continue;
                      Matcher m = EPISODE_PATTERN.matcher(stem);
                      if (!m.find()) continue;
                      int sNum = Integer.parseInt(m.group(1) != null ? m.group(1) : m.group(3));
                      int eNum = Integer.parseInt(m.group(2) != null ? m.group(2) : m.group(4));
                      if (!seasonCache.containsKey(sNum)) {
                          try {
                              JSONObject sObj = tmdbGet("/tv/" + tvId + "/season/" + sNum, opt.apiKey, "language=" + opt.lang);
                              seasonCache.put(sNum, sObj.optJSONArray("episodes"));
                          } catch (Exception e) { seasonCache.put(sNum, null); }
                      }
                      JSONArray eps = seasonCache.get(sNum);
                      if (eps != null) {
                          for (int i = 0; i < eps.length(); i++) {
                              JSONObject ep = eps.getJSONObject(i);
                              if (ep.optInt("episode_number") == eNum) {
                                  if (opt.force || !epNfo.exists()) {
                                      StringBuilder ex = new StringBuilder();
                                      ex.append("<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\n<episodedetails>\n");
                                      ex.append("  <title>").append(esc(ep.optString("name"))).append("</title>\n");
                                      ex.append("  <season>").append(sNum).append("</season>\n");
                                      ex.append("  <episode>").append(eNum).append("</episode>\n");
                                      ex.append("  <plot>").append(esc(ep.optString("overview"))).append("</plot>\n");
                                      ex.append("  <aired>").append(esc(ep.optString("air_date"))).append("</aired>\n");
                                      if (ep.optDouble("vote_average", 0) > 0) ex.append(String.format(Locale.US, "  <rating>%.1f</rating>\n", ep.optDouble("vote_average")));
                                      ex.append("</episodedetails>\n");
                                      writeText(epNfo, ex.toString());
                                      if (logger != null) logger.log(String.format(Locale.US, "  ✓ S%02dE%02d.nfo", sNum, eNum));
                                  }
                                  String still = ep.optString("still_path", "");
                                  if (opt.dlEpisodeThumbs && (opt.force || !epThumb.exists()) && !still.isEmpty()) {
                                      downloadFile(TMDB_IMG + "/w500" + still, epThumb);
                                  }
                                  break;
                              }
                          }
                      }
                  }
                  return folder;
              }
          }
