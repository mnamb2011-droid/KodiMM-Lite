              public static JSONObject tmdbGet(String endpoint, String apiKey, String extraQuery) throws Exception {
                  String urlStr = TMDB_API + endpoint + "?api_key=" + URLEncoder.encode(apiKey, "UTF-8")
                      + (extraQuery != null && !extraQuery.isEmpty() ? "&" + extraQuery : "");
                  HttpURLConnection conn = (HttpURLConnection) new URL(urlStr).openConnection();
                  conn.setConnectTimeout(15000);
                  conn.setReadTimeout(20000);
                  conn.setRequestMethod("GET");
                  int code = conn.getResponseCode();
                  if (code != 200) throw new Exception("TMDB HTTP " + code);
                  try (BufferedReader br = new BufferedReader(new InputStreamReader(conn.getInputStream(), StandardCharsets.UTF_8))) {
                      StringBuilder sb = new StringBuilder();
                      String line;
                      while ((line = br.readLine()) != null) sb.append(line);
                      return new JSONObject(sb.toString());
                  } finally { conn.disconnect(); }
              }

              public static String fetchYoutubeTrailerKey(boolean isMovie, String tmdbId, String apiKey) {
                  try {
                      JSONObject obj = tmdbGet((isMovie ? "/movie/" : "/tv/") + tmdbId + "/videos", apiKey, "");
                      JSONArray arr = obj.optJSONArray("results");
                      if (arr == null) return null;
                      String fallback = null;
                      for (int i = 0; i < arr.length(); i++) {
                          JSONObject v = arr.getJSONObject(i);
                          if ("YouTube".equalsIgnoreCase(v.optString("site"))) {
                              String key = v.optString("key", "");
                              if ("Trailer".equalsIgnoreCase(v.optString("type"))) return key;
                              if (fallback == null) fallback = key;
                          }
                      }
                      return fallback;
                  } catch (Exception e) { return null; }
              }

              public static boolean downloadFile(String urlStr, File dest) {
                  try {
                      HttpURLConnection conn = (HttpURLConnection) new URL(urlStr).openConnection();
                      conn.setConnectTimeout(15000); conn.setReadTimeout(30000);
                      if (conn.getResponseCode() != 200) return false;
                      try (InputStream in = conn.getInputStream(); FileOutputStream out = new FileOutputStream(dest)) {
                          byte[] buf = new byte[32768];
                          int n;
                          while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                      } finally { conn.disconnect(); }
                      return dest.exists() && dest.length() > 100;
                  } catch (Exception e) { return false; }
              }

              public static String pickBestLogo(JSONObject images, String langShort) {
                  JSONArray logos = images.optJSONArray("logos");
                  if (logos == null || logos.length() == 0) return null;
                  String best = null;
                  double bestScore = -1;
                  for (int i = 0; i < logos.length(); i++) {
                      JSONObject l = logos.optJSONObject(i);
                      if (l == null) continue;
                      String fp = l.optString("file_path", "");
                      if (fp.isEmpty()) continue;
                      String iso = l.optString("iso_639_1", "");
                      double score = l.optDouble("vote_average", 0) * 10 + l.optInt("width", 0) / 1000.0;
                      if ("en".equals(iso)) score += 100;
                      else if (langShort.equals(iso)) score += 85;
                      if (score > bestScore) { bestScore = score; best = fp; }
                  }
                  return best;
              }

              public static JSONArray searchTmdb(boolean isMovie, String query, String year, String apiKey, String lang) throws Exception {
                  String endpoint = isMovie ? "/search/movie" : "/search/tv";
                  String yearParam = isMovie ? "&year=" : "&first_air_date_year=";
                  String q = "query=" + URLEncoder.encode(query, "UTF-8") + "&language=" + lang
                      + (year != null && !year.isEmpty() ? yearParam + year : "");
                  JSONArray res = tmdbGet(endpoint, apiKey, q).optJSONArray("results");
                  if ((res == null || res.length() == 0) && year != null && !year.isEmpty()) {
                      q = "query=" + URLEncoder.encode(query, "UTF-8") + "&language=" + lang;
                      res = tmdbGet(endpoint, apiKey, q).optJSONArray("results");
                  }
                  return res != null ? res : new JSONArray();
              }

              public static File scrapeMovieById(File folder, int tmdbId, ScrapeOptions opt, Logger logger) throws Exception {
                  JSONObject d = tmdbGet("/movie/" + tmdbId, opt.apiKey, "language=" + opt.lang);
                  if (d.optString("overview", "").isEmpty() && !opt.lang.startsWith("en")) {
                      JSONObject en = tmdbGet("/movie/" + tmdbId, opt.apiKey, "language=en-US");
                      d.put("overview", en.optString("overview", ""));
                      if (d.optString("tagline", "").isEmpty()) d.put("tagline", en.optString("tagline", ""));
                  }
                  JSONObject credits = tmdbGet("/movie/" + tmdbId + "/credits", opt.apiKey, "");
                  String langShort = opt.lang.split("-")[0];
                  JSONObject images = tmdbGet("/movie/" + tmdbId + "/images", opt.apiKey, "include_image_language=en," + langShort + ",null");

                  StringBuilder xml = new StringBuilder();
                  xml.append("<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\n<movie>\n");
                  xml.append("  <title>").append(esc(d.optString("title"))).append("</title>\n");
                  xml.append("  <originaltitle>").append(esc(d.optString("original_title"))).append("</originaltitle>\n");
                  xml.append("  <tagline>").append(esc(d.optString("tagline"))).append("</tagline>\n");
                  xml.append("  <plot>").append(esc(d.optString("overview"))).append("</plot>\n");
                  xml.append("  <outline>").append(esc(d.optString("overview"))).append("</outline>\n");
                  if (d.optInt("runtime") > 0) xml.append("  <runtime>").append(d.optInt("runtime")).append("</runtime>\n");
                  String rel = d.optString("release_date", "");
                  String year = rel.length() >= 4 ? rel.substring(0, 4) : "";
                  if (!rel.isEmpty()) {
                      xml.append("  <premiered>").append(esc(rel)).append("</premiered>\n");
                      if (!year.isEmpty()) xml.append("  <year>").append(esc(year)).append("</year>\n");
                  }
                  double vote = d.optDouble("vote_average", 0);
                  if (vote > 0) {
                      xml.append("  <ratings><rating name=\"themoviedb\" max=\"10\" default=\"true\"><value>")
                         .append(String.format(Locale.US, "%.1f", vote))
                         .append("</value><votes>").append(d.optInt("vote_count", 0))
                         .append("</votes></rating></ratings>\n");
                      xml.append(String.format(Locale.US, "  <rating>%.1f</rating>\n", vote));
                  }
                  xml.append("  <uniqueid type=\"tmdb\" default=\"true\">").append(tmdbId).append("</uniqueid>\n");
                  if (!d.optString("imdb_id", "").isEmpty()) xml.append("  <uniqueid type=\"imdb\">").append(esc(d.optString("imdb_id"))).append("</uniqueid>\n");
                  JSONArray genres = d.optJSONArray("genres");
                  if (genres != null) for (int i = 0; i < genres.length(); i++) xml.append("  <genre>").append(esc(genres.getJSONObject(i).optString("name"))).append("</genre>\n");
                  JSONArray studios = d.optJSONArray("production_companies");
                  if (studios != null) for (int i = 0; i < Math.min(3, studios.length()); i++) xml.append("  <studio>").append(esc(studios.getJSONObject(i).optString("name"))).append("</studio>\n");
                  JSONObject coll = d.optJSONObject("belongs_to_collection");
                  if (coll != null && !coll.optString("name", "").isEmpty()) xml.append("  <set><name>").append(esc(coll.optString("name"))).append("</name></set>\n");
                  JSONArray crew = credits.optJSONArray("crew");
                  if (crew != null) {
                      for (int i = 0; i < crew.length(); i++) {
                          JSONObject c = crew.getJSONObject(i);
                          String job = c.optString("job");
                          if ("Director".equals(job)) xml.append("  <director>").append(esc(c.optString("name"))).append("</director>\n");
                          else if ("Screenplay".equals(job) || "Writer".equals(job)) xml.append("  <credits>").append(esc(c.optString("name"))).append("</credits>\n");
                      }
                  }
                  JSONArray cast = credits.optJSONArray("cast");
                  if (cast != null) {
                      for (int i = 0; i < Math.min(15, cast.length()); i++) {
                          JSONObject a = cast.getJSONObject(i);
                          xml.append("  <actor><name>").append(esc(a.optString("name")))
                             .append("</name><role>").append(esc(a.optString("character")))
                             .append("</role><order>").append(i).append("</order>");
                          String pp = a.optString("profile_path", "");
                          if (!pp.isEmpty()) xml.append("<thumb>").append(TMDB_IMG).append("/w500").append(pp).append("</thumb>");
                          xml.append("</actor>\n");
                      }
                  }
                  xml.append("</movie>\n");
                  writeText(new File(folder, "movie.nfo"), xml.toString());
                  if (logger != null) logger.log("  ✓ movie.nfo");

                  File poster = new File(folder, "poster.jpg");
                  String pp = d.optString("poster_path", "");
                  if (opt.dlPoster && (opt.force || !poster.exists()) && !pp.isEmpty() && downloadFile(TMDB_IMG + "/" + opt.posterSize + pp, poster)) {
                      if (logger != null) logger.log("  ✓ poster.jpg");
                  }
                  File fanart = new File(folder, "fanart.jpg");
                  String bp = d.optString("backdrop_path", "");
                  if (opt.dlFanart && (opt.force || !fanart.exists()) && !bp.isEmpty() && downloadFile(TMDB_IMG + "/" + opt.fanartSize + bp, fanart)) {
                      if (logger != null) logger.log("  ✓ fanart.jpg");
                  }
                  File land = new File(folder, "landscape.jpg");
                  if (opt.dlLandscape && (opt.force || !land.exists()) && !bp.isEmpty()) {
                      JSONArray bds = images.optJSONArray("backdrops");
                      String landPath = (bds != null && bds.length() > 1) ? bds.getJSONObject(1).optString("file_path", bp) : bp;
                      if (downloadFile(TMDB_IMG + "/w780" + landPath, land) && logger != null) logger.log("  ✓ landscape.jpg");
                  }
                  File logo = new File(folder, "clearlogo.png");
                  String lp = pickBestLogo(images, langShort);
                  if (opt.dlLogo && (opt.force || !logo.exists()) && lp != null && downloadFile(TMDB_IMG + "/original" + lp, logo)) {
                      if (logger != null) logger.log("  ✓ clearlogo.png");
                  }

                  if (opt.autoRename) {
                      String enTitle = d.optString("original_title", d.optString("title", ""));
                      if (enTitle.isEmpty()) enTitle = d.optString("title", "");
                      String newName = sanitizeFilename(year.isEmpty() ? enTitle : (enTitle + " (" + year + ")"));
                      if (!newName.isEmpty() && !newName.equals(folder.getName())) {
                          File renamed = new File(folder.getParentFile(), newName);
                          if (!renamed.exists() && folder.renameTo(renamed)) {
                              if (logger != null) logger.log("  🏷 إعادة تسمية ← " + newName);
                              return renamed;
                          }
                      }
                  }
                  return folder;
              }

              public static File scrapeTvById(File folder, int tvId, ScrapeOptions opt, Logger logger) throws Exception {
                  JSONObject d = tmdbGet("/tv/" + tvId, opt.apiKey, "language=" + opt.lang);
                  if (d.optString("overview", "").isEmpty() && !opt.lang.startsWith("en")) {
                      JSONObject en = tmdbGet("/tv/" + tvId, opt.apiKey, "language=en-US");
                      d.put("overview", en.optString("overview", ""));
                  }
                  JSONObject credits = tmdbGet("/tv/" + tvId + "/credits", opt.apiKey, "");
                  String langShort = opt.lang.split("-")[0];
                  JSONObject images = tmdbGet("/tv/" + tvId + "/images", opt.apiKey, "include_image_language=en," + langShort + ",null");

                  File nfo = new File(folder, "tvshow.nfo");
                  if (opt.force || !nfo.exists()) {
                      StringBuilder xml = new StringBuilder();
                      xml.append("<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\n<tvshow>\n");
                      xml.append("  <title>").append(esc(d.optString("name"))).append("</title>\n");
                      xml.append("  <originaltitle>").append(esc(d.optString("original_name"))).append("</originaltitle>\n");
                      xml.append("  <plot>").append(esc(d.optString("overview"))).append("</plot>\n");
                      String fa = d.optString("first_air_date", "");
                      if (!fa.isEmpty()) {
                          xml.append("  <premiered>").append(esc(fa)).append("</premiered>\n");
                          if (fa.length() >= 4) xml.append("  <year>").append(esc(fa.substring(0, 4))).append("</year>\n");
                      }
                      double vote = d.optDouble("vote_average", 0);
                      if (vote > 0) xml.append(String.format(Locale.US, "  <rating>%.1f</rating>\n", vote));
