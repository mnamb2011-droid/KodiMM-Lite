              private void updateDashboard() {
                  int mDone = 0, noSrt = 0; long mSize = 0;
                  for (MediaHelper.MediaItem m : cachedMovies) {
                      if (m.isComplete()) mDone++;
                      if (!m.hasSrt) noSrt++;
                      mSize += m.sizeBytes;
                  }
                  int tDone = 0, eps = 0; long tSize = 0;
                  for (MediaHelper.MediaItem t : cachedTv) { if (t.isComplete()) tDone++; eps += t.episodeCount; tSize += t.sizeBytes; }
                  tvDashboard.setText(
                      "📊 ملخص المكتبة:\n" +
                      "🎬 الأفلام: " + cachedMovies.size() + " (مكتمل: " + mDone + " | ناقص: " + (cachedMovies.size() - mDone) + " | بدون SRT: " + noSrt + ") — " + MediaHelper.formatSize(mSize) + "\n" +
                      "📺 المسلسلات: " + cachedTv.size() + " (" + eps + " حلقة | مكتمل: " + tDone + ") — " + MediaHelper.formatSize(tSize) + "\n" +
                      "❤️ المفضلة: " + favorites.size() + "   •   👁 تمت المشاهدة: " + watched.size()
                  );
              }

              private void renderLibrary(boolean isMovies) {
                  LinearLayout container = isMovies ? listMoviesContainer : listTvContainer;
                  List<MediaHelper.MediaItem> source = new ArrayList<>(isMovies ? cachedMovies : cachedTv);
                  String q = (isMovies ? etSearchMovies : etSearchTv).getText().toString().trim().toLowerCase(Locale.ROOT);
                  int filter = isMovies ? movieFilter : tvFilter;

                  Collections.sort(source, (a, b) -> {
                      if (sortMode == 1) return Integer.compare(b.yearValue(), a.yearValue());
                      if (sortMode == 2) return Double.compare(b.ratingValue(), a.ratingValue());
                      if (sortMode == 3) return Long.compare(b.sizeBytes, a.sizeBytes);
                      return a.displayTitle.compareToIgnoreCase(b.displayTitle);
                  });

                  List<MediaHelper.MediaItem> filtered = new ArrayList<>();
                  int complete = 0;
                  for (MediaHelper.MediaItem it : source) {
                      if (it.isComplete()) complete++;
                      String key = it.folder.getAbsolutePath();
                      if (filter == 1 && it.isComplete()) continue;
                      if (filter == 2 && !it.isComplete()) continue;
                      if (filter == 3 && !favorites.contains(key)) continue;
                      if (filter == 4 && watched.contains(key)) continue;
                      if (isMovies && !selectedGenre.isEmpty() && !it.genreList.contains(selectedGenre)) continue;
                      if (isMovies && !selectedCollection.isEmpty() && !selectedCollection.equals(it.collection)) continue;
                      if (!q.isEmpty()
                          && !it.displayTitle.toLowerCase(Locale.ROOT).contains(q)
                          && !it.folder.getName().toLowerCase(Locale.ROOT).contains(q)
                          && !it.genres.toLowerCase(Locale.ROOT).contains(q)
                          && !it.director.toLowerCase(Locale.ROOT).contains(q)
                          && !it.collection.toLowerCase(Locale.ROOT).contains(q)) continue;
                      filtered.add(it);
                  }

                  container.removeAllViews();
                  TextView stats = isMovies ? tvMoviesStats : tvTvStats;
                  String colBadge = (isMovies && !selectedCollection.isEmpty()) ? ("  •  📚 " + selectedCollection) : "";
                  stats.setText("المعروض: " + filtered.size() + " من " + source.size() + "  •  مكتمل: " + complete + "  •  ناقص: " + (source.size() - complete) + colBadge);

                  if (filtered.isEmpty()) {
                      TextView empty = new TextView(this);
                      empty.setText(source.isEmpty()
                          ? "لا توجد مجلدات هنا.\nاختر المسار من ⚙️ الإعدادات أو نظّم الأفلام من ⚡ الأدوات."
                          : "لا توجد نتائج مطابقة للبحث أو الفلتر.");
                      empty.setTextColor(Color.parseColor("#64748B"));
                      empty.setGravity(Gravity.CENTER);
                      empty.setPadding(dp(20), dp(40), dp(20), dp(20));
                      container.addView(empty);
                      return;
                  }

                  if (isGridView) {
                      int cols = 3;
                      for (int i = 0; i < filtered.size(); i += cols) {
                          LinearLayout row = new LinearLayout(this);
                          row.setOrientation(LinearLayout.HORIZONTAL);
                          row.setPadding(0, 0, 0, dp(10));
                          for (int c = 0; c < cols; c++) {
                              int idx = i + c;
                              if (idx < filtered.size()) row.addView(createGridCard(filtered.get(idx)));
                              else {
                                  View sp = new View(this);
                                  sp.setLayoutParams(new LinearLayout.LayoutParams(0, 1, 1f));
                                  row.addView(sp);
                              }
                          }
                          container.addView(row);
                      }
                  } else {
                      for (MediaHelper.MediaItem it : filtered) container.addView(createListCard(it));
                  }
              }

              private Bitmap decodeThumb(File imgFile, int maxW) {
                  try {
                      BitmapFactory.Options opts = new BitmapFactory.Options();
                      opts.inJustDecodeBounds = true;
                      BitmapFactory.decodeFile(imgFile.getAbsolutePath(), opts);
                      int scale = 1;
                      while (opts.outWidth / scale > maxW) scale *= 2;
                      opts.inJustDecodeBounds = false;
                      opts.inSampleSize = scale;
                      return BitmapFactory.decodeFile(imgFile.getAbsolutePath(), opts);
                  } catch (Exception e) { return null; }
              }

