              private void findDuplicates() {
                  Map<String, List<String>> seen = new HashMap<>();
                  for (MediaHelper.MediaItem m : cachedMovies) {
                      String k = !m.tmdbId.isEmpty() ? ("tmdb:" + m.tmdbId) : m.displayTitle.toLowerCase(Locale.ROOT);
                      seen.computeIfAbsent(k, x -> new ArrayList<>()).add(m.folder.getName());
                  }
                  StringBuilder sb = new StringBuilder();
                  for (Map.Entry<String, List<String>> e : seen.entrySet()) {
                      if (e.getValue().size() > 1) sb.append("• ").append(String.join("  ↔  ", e.getValue())).append("\n");
                  }
                  new AlertDialog.Builder(this).setTitle("👯 الأفلام المكررة")
                      .setMessage(sb.length() == 0 ? "✅ لا توجد أفلام مكررة!" : sb.toString())
                      .setPositiveButton("حسناً", null).show();
              }

